# Panel de Pages CMS. Cada etiqueta responde a «¿qué escribirá aquí alguien no técnico?».
# Segundo idioma: copia el bloque «landing» al final con name/label/path nuevos y `fields: *campos` (ver README › Segundo idioma).
settings:
  content:
    merge: true
media:
- name: images
  label: Imágenes
  input: src/assets/images
  output: /src/assets/images
  categories:
  - image
  rename: safe
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - avif
  - svg
- name: videos
  label: Videos MP4 ya optimizados
  input: public/videos
  output: /videos
  extensions:
  - mp4
  rename: safe
content:
- name: landing
  label: Página principal
  type: file
  path: src/content/landing.json
  format: json
  operations:
    delete: false
  # idioma no aparece en el panel; merge: true lo conserva al guardar.
  fields: &campos
  - name: negocio
    label: Empresa
    type: object
    fields:
    - name: nombre
      label: Nombre
      type: string
    - name: web
      label: Dominio completo (https://...)
      type: string
    - name: logo
      label: Logo
      type: image
      options:
        media: images
    - name: descripcion
      label: Descripción
      type: text
  - name: hero
    label: Portada
    type: object
    fields:
    - name: etiqueta
      label: Texto pequeño superior (opcional)
      type: string
    - name: titulo
      label: Título
      type: string
    - name: subtitulo
      label: Subtítulo
      type: text
    - name: imagen
      label: Imagen / portada del video
      type: image
      options:
        media: images
    - name: alt
      label: Qué se ve en la imagen (para lectores de pantalla)
      type: string
    - name: video
      label: Video MP4 optimizado (subir archivo)
      type: file
      options:
        media: videos
    - name: videoExterno
      label: 'Video externo: URL directa HTTPS a MP4 (opcional)'
      type: string
    - name: modo
      label: Formato de portada
      type: select
      options:
        values:
        - imagen
        - video
    - name: cta
      label: Texto del botón principal
      type: string
  - name: secciones
    label: Títulos de secciones
    type: object
    fields:
    - name: servicios
      label: Servicios
      type: string
    - name: proyectos
      label: Proyectos
      type: string
    - name: marcas
      label: Marcas o clientes
      type: string
    - name: contacto
      label: Contacto
      type: string
    - name: contactoTexto
      label: Texto de contacto
      type: text
  - name: servicios
    label: Servicios
    type: object
    list:
      max: 12
      collapsible:
        collapsed: true
        summary: '{nombre}'
    fields:
    - name: nombre
      label: Nombre
      type: string
    - name: descripcion
      label: Descripción
      type: text
    - name: foto
      label: Foto
      type: image
      options:
        media: images
    - name: alt
      label: Qué se ve en la foto (obligatorio si hay foto)
      type: string
  - name: proyectos
    label: Proyectos
    type: object
    list:
      max: 12
      collapsible:
        collapsed: true
        summary: '{titulo}'
    fields:
    - name: titulo
      label: Título
      type: string
    - name: descripcion
      label: Descripción
      type: text
    - name: foto
      label: Foto
      type: image
      options:
        media: images
    - name: alt
      label: Qué se ve en la foto (obligatorio si hay foto)
      type: string
  - name: marcas
    label: Logos de marcas o clientes (con 6 o más se mueven en carrusel)
    type: object
    list:
      max: 40
      collapsible:
        collapsed: true
        summary: '{nombre}'
    fields:
    - name: nombre
      label: Nombre de la marca
      type: string
    - name: logo
      label: Logo (autorizado)
      type: image
      options:
        media: images
  - name: contacto
    label: Contacto
    type: object
    fields:
    - name: whatsapp
      label: Número de WhatsApp con código de país, solo números (ej. 18095551234)
      type: string
    - name: mensajeWhatsapp
      label: Mensaje inicial de WhatsApp
      type: string
    - name: telefono
      label: Teléfono
      type: string
    - name: email
      label: Correo visible (no cambia el destinatario del formulario)
      type: string
    - name: direccion
      label: Dirección
      type: string
    - name: horario
      label: Horario informativo
      type: string
    - name: mapa
      label: Mapa (opcional)
      type: object
      fields:
      - name: imagen
        label: Imagen del mapa
        type: image
        options:
          media: images
      - name: alt
        label: Qué muestra el mapa
        type: string
      - name: enlace
        label: Enlace «Cómo llegar» (Google Maps, HTTPS)
        type: string
      - name: credito
        label: Crédito del mapa (ej. © OpenStreetMap)
        type: string
  - name: redes
    label: Redes sociales
    type: object
    list:
      max: 12
      collapsible:
        collapsed: true
        summary: '{nombre}'
    fields:
    - name: nombre
      label: Nombre
      type: string
    - name: url
      label: Enlace completo HTTPS
      type: string
  - name: seo
    label: Buscadores y redes
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: descripcion
      label: Descripción
      type: text
    - name: imagen
      label: Imagen al compartir en redes (1200 px de ancho)
      type: image
      options:
        media: images
    - name: locale
      label: Región para redes (ej. es_ES, es_DO, en_US)
      type: string
    - name: indexar
      label: Permitir indexación (activar solo cuando el dominio real apunte a este sitio)
      type: boolean
  - name: formulario
    label: Formulario
    type: object
    fields:
    - name: whatsapp
      label: Enviar por WhatsApp (usa el número de Contacto)
      type: boolean
    - name: correo
      label: Enviar por correo (solo si el técnico configuró Web3Forms)
      type: boolean
    - name: titulo
      label: Título
      type: string
    - name: nombre
      label: Etiqueta del nombre
      type: string
    - name: email
      label: Etiqueta del correo
      type: string
    - name: telefono
      label: Etiqueta del teléfono (vacío = no se pide)
      type: string
    - name: mensaje
      label: Etiqueta del mensaje
      type: string
    - name: enviarWhatsapp
      label: Botón de WhatsApp
      type: string
    - name: enviarCorreo
      label: Botón de correo
      type: string
    - name: saludo
      label: Primera línea del mensaje de WhatsApp
      type: string
    - name: aviso
      label: Aviso de uso de datos
      type: text
    - name: asunto
      label: Asunto del correo que recibes
      type: string
    - name: requerido
      label: 'Error de campo vacío ({campo} se reemplaza por el nombre del campo)'
      type: string
    - name: correoInvalido
      label: Error de correo inválido
      type: string
    - name: enviando
      label: Mensaje mientras se envía
      type: string
    - name: exito
      label: Mensaje de envío correcto
      type: string
    - name: error
      label: Mensaje de error al enviar
      type: string
  - name: interfaz
    label: Textos de navegación y controles
    type: object
    fields:
    - name: menu
      label: Nombre del menú (lectores de pantalla)
      type: string
    - name: menuAbrir
      label: Abrir menú (lectores de pantalla)
      type: string
    - name: menuCerrar
      label: Cerrar menú (lectores de pantalla)
      type: string
    - name: menuServicios
      label: Enlace a servicios
      type: string
    - name: menuProyectos
      label: Enlace a proyectos
      type: string
    - name: menuContacto
      label: Enlace a contacto
      type: string
    - name: idioma
      label: Nombre del selector de idioma
      type: string
    - name: saltar
      label: Saltar al contenido
      type: string
    - name: pausar
      label: Botón pausar (video y logos)
      type: string
    - name: reproducir
      label: Botón reproducir (video y logos)
      type: string
    - name: whatsapp
      label: Texto del botón de WhatsApp
      type: string
    - name: comoLlegar
      label: Texto del enlace del mapa
      type: string
    - name: nuevaPestana
      label: Aviso de enlace en otra pestaña (lectores de pantalla)
      type: string
    - name: contactoFlotante
      label: Botón flotante en celular (vacío = sin botón)
      type: string
    - name: volver
      label: Volver al inicio
      type: string
    - name: noEncontrado
      label: Título de página no encontrada
      type: string
    - name: noEncontradoTexto
      label: Mensaje de página no encontrada
      type: string
    - name: derechos
      label: Texto del pie
      type: string
